<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Connect - Social Media
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <a
        href="/"
        class="logo"
    >
        Connect
    </a>


    <nav>

        <a href="#feed">
            Feed
        </a>

        <a href="#people">
            People
        </a>

        <button
            id="authBtn"
            onclick="openAuth()"
        >
            Login
        </button>

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main class="container">


    <!-- HERO -->

    <section class="hero">

        <div>

            <span>
                MINI SOCIAL PLATFORM
            </span>

            <h1>
                Share. Connect. Follow.
            </h1>

            <p>
                Create posts, comment,
                like posts and follow
                other users.
            </p>

        </div>

    </section>


    <!-- ================= FEED ================= -->

    <section
        id="feed"
        class="layout"
    >


        <div class="main-column">


            <!-- CREATE POST -->

            <div
                id="composer"
                class="composer hidden"
            >

                <h2>
                    Create a Post
                </h2>


                <textarea
                    id="postContent"
                    maxlength="500"
                    placeholder="What's on your mind?"
                ></textarea>


                <input
                    id="postImage"
                    placeholder="Optional image URL"
                >


                <button
                    class="primary"
                    onclick="createPost()"
                >
                    Post
                </button>

            </div>


            <div class="section-title">

                <h2>
                    Latest Posts
                </h2>

            </div>


            <div id="postList">

            </div>


        </div>


        <!-- ================= PEOPLE ================= -->

        <aside
            id="people"
            class="sidebar"
        >

            <h2>
                People
            </h2>


            <div id="userList">

            </div>

        </aside>


    </section>


</main>


<!-- ================= LOGIN MODAL ================= -->

<div
    id="authModal"
    class="modal hidden"
>


    <div class="modal-box">


        <button
            class="close"
            onclick="closeAuth()"
        >
            ×
        </button>


        <div class="tabs">


            <button
                id="loginTab"
                class="active"
                onclick="showLogin()"
            >
                Login
            </button>


            <button
                id="registerTab"
                onclick="showRegister()"
            >
                Register
            </button>


        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <input
                id="loginValue"
                placeholder="Username or email"
                required
            >


            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                required
            >


            <button
                class="primary"
                type="submit"
            >
                Login
            </button>


        </form>


        <!-- REGISTER FORM -->

        <form
            id="registerForm"
            class="hidden"
        >


            <input
                id="registerName"
                placeholder="Full Name"
                required
            >


            <input
                id="registerUsername"
                placeholder="Username"
                required
            >


            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
                required
            >


            <input
                id="registerPassword"
                type="password"
                placeholder="Password (6+ characters)"
                required
            >


            <button
                class="primary"
                type="submit"
            >
                Create Account
            </button>


        </form>


        <p id="authMessage"></p>


    </div>

</div>


<!-- TOAST -->

<div id="toast">

</div>


<script src="app.js"></script>


</body>

</html>
