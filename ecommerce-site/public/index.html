<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - E-Commerce</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="logo">
        ShopEasy
    </div>

    <nav>

        <a href="#products">
            Products
        </a>

        <a href="#cart">
            Cart (<span id="cartCount">0</span>)
        </a>

        <button id="authBtn"
                onclick="openAuth()">
            Login
        </button>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <div>

        <p class="tag">
            SIMPLE • FAST • SECURE
        </p>

        <h1>
            Everything you need
            in one place.
        </h1>

        <p>
            Browse products, add them
            to your cart and place your order.
        </p>

        <a href="#products"
           class="hero-button">
            Shop Now
        </a>

    </div>

</section>


<!-- PRODUCTS -->

<section id="products"
         class="section">

    <h2>
        Our Products
    </h2>

    <div id="productGrid"
         class="product-grid">

    </div>

</section>


<!-- CART -->

<section id="cart"
         class="section cart-section">

    <h2>
        Shopping Cart
    </h2>

    <div id="cartItems">

    </div>

    <div class="cart-footer">

        <h3>
            Total:
            ₹<span id="cartTotal">0</span>
        </h3>

        <button class="primary"
                onclick="checkout()">

            Place Order

        </button>

    </div>

</section>


<!-- ORDERS -->

<section id="orders"
         class="section hidden">

    <h2>
        My Orders
    </h2>

    <div id="orderList">

    </div>

</section>


<!-- LOGIN / REGISTER MODAL -->

<div id="authModal"
     class="modal hidden">

    <div class="modal-box">

        <button class="close"
                onclick="closeAuth()">
            ×
        </button>

        <div class="tabs">

            <button id="loginTab"
                    class="active"
                    onclick="showLogin()">

                Login

            </button>

            <button id="registerTab"
                    onclick="showRegister()">

                Register

            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                required>

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                required>

            <button
                class="primary"
                type="submit">

                Login

            </button>

        </form>


        <!-- REGISTER -->

        <form id="registerForm"
              class="hidden">

            <input
                id="registerName"
                type="text"
                placeholder="Full Name"
                required>

            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
                required>

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
                required>

            <button
                class="primary"
                type="submit">

                Create Account

            </button>

        </form>


        <p id="authMessage"
           class="message">

        </p>

    </div>

</div>


<!-- TOAST -->

<div id="toast"
     class="toast">

</div>


<script src="app.js"></script>

</body>

</html>
